  <line x1="224" y1="70" x2="318" y2="110" stroke="#0EA5A3" stroke-width="3" opacity="0.6"/>
  <line x1="224" y1="70" x2="224" y2="224" stroke="#00D9A3" stroke-width="3" opacity="0.6"/>
  
  <line x1="130" y1="110" x2="80" y2="224" stroke="#0EA5A3" stroke-width="3" opacity="0.6"/>
  <line x1="130" y1="110" x2="224" y2="224" stroke="#00D9A3" stroke-width="3" opacity="0.6"/>
  
  <line x1="318" y1="110" x2="368" y2="224" stroke="#00D9A3" stroke-width="3" opacity="0.6"/>
  <line x1="318" y1="110" x2="224" y2="224" stroke="#0EA5A3" stroke-width="3" opacity="0.6"/>
  
  <line x1="80" y1="224" x2="130" y2="338" stroke="#00D9A3" stroke-width="3" opacity="0.6"/>
  <line x1="80" y1="224" x2="224" y2="224" stroke="#0EA5A3" stroke-width="3" opacity="0.6"/>
  
  <line x1="368" y1="224" x2="318" y2="338" stroke="#0EA5A3" stroke-width="3" opacity="0.6"/>
  <line x1="368" y1="224" x2="224" y2="224" stroke="#00D9A3" stroke-width="3" opacity="0.6"/>
  
