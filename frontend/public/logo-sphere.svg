<svg viewBox="0 0 448 448" xmlns="http://www.w3.org/2000/svg">
  <!-- Green and cyan network sphere icon -->
  <!-- Outer sphere structure -->
  <circle cx="224" cy="224" r="180" fill="none" stroke="#00D9A3" stroke-width="8" opacity="0.3"/>
  
  <!-- Network nodes and connections -->
  <!-- Top node -->
  <circle cx="224" cy="70" r="16" fill="#00D9A3"/>
  <circle cx="224" cy="70" r="12" fill="#0EA5A3"/>
  
  <!-- Upper left -->
  <circle cx="130" cy="110" r="14" fill="#00D9A3"/>
  <circle cx="130" cy="110" r="10" fill="#0EA5A3"/>
  
  <!-- Upper right -->
  <circle cx="318" cy="110" r="14" fill="#00D9A3"/>
  <circle cx="318" cy="110" r="10" fill="#0EA5A3"/>
  
  <!-- Left -->
  <circle cx="80" cy="224" r="14" fill="#0EA5A3"/>
  <circle cx="80" cy="224" r="10" fill="#00D9A3"/>
  
  <!-- Right -->
  <circle cx="368" cy="224" r="14" fill="#0EA5A3"/>
  <circle cx="368" cy="224" r="10" fill="#00D9A3"/>
  
  <!-- Lower left -->
  <circle cx="130" cy="338" r="14" fill="#00D9A3"/>
