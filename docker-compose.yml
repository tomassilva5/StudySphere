
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studysphere_frontend
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "5000:5000"
    command: node server.js
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studysphere_backend
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    environment:
      - FRONTEND_URL=http://localhost:5000
      - PORT=3000
    

