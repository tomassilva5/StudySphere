services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studysphere_frontend
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "5000:5000"
    command: npx next dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studysphere_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules